<script>
/* ==========================================================================
   All publications live in publications.md (same format as the old site).
   To add a paper, add one "- " line under the right "## year" and "### type".
   ========================================================================== */
const TYPE = [
  ["Journal", /^Journal/],
  ["Conference", /^Conference( \(full papers\))?$/],
  ["Workshop & Abstract", /short papers|abstracts|workshop/i],
  ["Domestic", /domestic/i],
  ["Preprint", /Technical Report/i],
  ["Patent", /Patent/i],
  ["Book Chapter", /Book/i]
];
const HOT = /^(Spotlight|Highlight|Oral)$/i;
const AWARD = /Award|Winner|Runner-up|Honorable|Cum Laude|Fellowship|Cover Article|Travel|Grant|place|Champion|Invited/i;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
// venues whose month is not written yet ("Accepted at NeurIPS, 2026") fall back to the usual conference month
const VENUE_MONTH = { NeurIPS: 12, ICML: 7, ICLR: 4, CVPR: 6, ICCV: 10, ECCV: 10, MICCAI: 9, AAAI: 2, WACV: 1, ICRA: 5 };
function monthOf(s) {
  const m = s.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(19|20)\d\d/i);
  if (m) return MONTHS.indexOf(m[1].toLowerCase().slice(0, 3)) + 1;
  for (const [v, mo] of Object.entries(VENUE_MONTH)) if (new RegExp("\\b" + v + "\\b").test(s)) return mo;
  return 0;
}

// A workshop/abstract with the same title and authors as a journal or conference paper
// is shown under that paper ("Also presented at ...") instead of as a separate item.
const norm = s => s.toLowerCase().replace(/\*/g, "").replace(/[^a-z0-9]/g, "");
function mergeWorkshops(list) {
  const main = list.filter(p => p.type === "Journal" || p.type === "Conference");
  return list.filter(p => {
    if (p.type !== "Workshop & Abstract" || !p.title) return true;
    const t = main.find(m => norm(m.title) === norm(p.title) && norm(m.authors) === norm(p.authors));
    if (!t) return true;
    const venue = p.rest.replace(/^Accepted at\s+/i, "").replace(/\s*\(\*+[^)]*\)/g, "").replace(/,\s*journal presentation of .*/i, " (journal presentation)").trim();
    (t.also = t.also || []).push({ venue, badges: p.badges, links: p.links });
    return false;
  });
}

// A preprint that was later published (same title, or the same arXiv number, or "superseded by arXiv:...")
// is shown under the published item instead of as a separate entry.
const arxivIds = s => (s.match(/\d{4}\.\d{4,5}/g) || []);
function mergePreprints(list) {
  const pubs = list.filter(p => p.type !== "Preprint");
  const rank = t => (t === "Journal" || t === "Conference") ? 0 : 1;
  return list.filter(p => {
    if (p.type !== "Preprint" || !p.title) return true;
    const own = arxivIds(p.links.map(l => l[1]).join(" ") + " " + p.rest.split(/superseded/i)[0]);
    const later = (p.rest.match(/superseded by (arXiv:\S+)/i) || [])[1];
    const want = later ? arxivIds(later) : own;
    const cands = pubs.filter(t =>
      norm(t.title) === norm(p.title) ||
      want.some(id => arxivIds(t.links.map(l => l[1]).join(" ")).includes(id)));
    if (!cands.length) return true;
    const t = cands.sort((a, b) => rank(a.type) - rank(b.type))[0];
    const venue = p.rest.replace(/\s*\(\*+[^)]*\)/g, "").replace(/\s*\(superseded by [^)]*\)/i, "").trim();
    const label = norm(t.title) === norm(p.title) ? "Preprint: " + venue : "Earlier version: “" + p.title + ",” " + venue;
    (t.also = t.also || []).push({ venue: label, raw: true, badges: [], links: p.links });
    if (!t.links.some(l => l[0] === "report")) p.links.filter(l => l[0] === "report").forEach(l => t.links.push(l));
    return false;
  });
}

// ---------- one publication ----------
const VENUE_RE = /(NeurIPS|ICML|ICLR|CVPR|ICCV|ECCV|AAAI|MICCAI|WACV|ICRA|ISBI|ICASSP|ISMRM|NSS-MIC|EMBC|ICPR|ICB|AACR|ICEIC)/;
const JOURNAL_SHORT = [[/Transactions on Medical Imaging/, "IEEE TMI"], [/Transactions on Image Processing/, "IEEE TIP"],
  [/Transactions on Computational Imaging/, "IEEE TCI"], [/Transactions on Biomedical Engineering/, "IEEE TBME"],
  [/Journal of Selected Topics in Signal Processing/, "IEEE JSTSP"], [/Signal Processing Magazine/, "IEEE SPM"],
  [/Transactions on Nuclear Science/, "IEEE TNS"], [/IEEE Access/, "IEEE Access"], [/Medical Image Analysis/, "MedIA"],
  [/Pattern Recognition Letters/, "PRL"], [/Image and Vision Computing/, "IMAVIS"], [/Physics in Medicine and Biology/, "PMB"],
  [/Medical Physics/, "Med. Phys."], [/Journal of Nuclear Medicine/, "JNM"], [/Theranostics/, "Theranostics"],
  [/NeuroImage/, "NeuroImage"], [/Scientific Reports/, "Sci. Rep."], [/arXiv/, "arXiv"]];
function venueShort(p) {
  const w = p.rest.match(/\b(CVPR|ICCV|ECCV)\s*(Workshops|W\b)/); if (w) return w[1] + "W";
  const m = p.rest.match(VENUE_RE); if (m) return m[1];
  const j = JOURNAL_SHORT.find(([r]) => r.test(p.rest)); if (j) return j[1];
  return p.type;
}
const ICON = {
  paper:   '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  report:  '<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  project: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  code:    '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  video:   '<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/>',
};
const LABEL = { paper: "Paper", report: "arXiv", project: "Project", code: "Code", video: "Video" };
const btn = ([l, u]) => { const k = ICON[l] ? l : "paper";
  return `<a class="lnk l-${k}" href="${u}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${LABEL[l] || l[0].toUpperCase() + l.slice(1)}</a>`; };
const MEDAL = (kind, label, title) => `<span class="medal m-${kind}" title="${esc(title || label)}">
  <svg viewBox="0 0 40 48"><path class="rb" d="M12 0h7l-4 16h-7zM21 0h7l4 16h-7z"/><circle class="disc" cx="20" cy="30" r="14"/><circle class="ring" cx="20" cy="30" r="10"/><path class="star" d="m20 23 2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z"/></svg>
  <span>${esc(label)}</span></span>`;

function card(p) {
  const hot = p.badges.filter(b => b[0] === "hot").map(b => b[1]);
  const awards = p.badges.filter(b => b[0] === "award").map(b => b[1]);
  // invitations and cover articles are listed as text but get no medal
  const medalAwards = awards.filter(a => !/^(Invited|Cover Article|AMPC select)/i.test(a));
  const medals = [...new Set(hot)].map(h => MEDAL(h.toLowerCase(), h)).concat(medalAwards.length ? [MEDAL("award", "Award", medalAwards.join("; "))] : []);
  const thumb = p.thumb
    ? `<img src="${p.thumb}" alt="" loading="lazy" onerror="this.closest('.pub').classList.remove('has-thumb'); this.parentNode.remove()">`
    : "";
  return `
  <article class="pub${medals.length ? " has-medal" : ""}${p.thumb ? " has-thumb" : ""}">
    ${p.thumb ? `<button class="th" type="button" data-src="${p.thumb}" data-cap="${esc(p.title)}" aria-label="Enlarge figure">${thumb}<span class="zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></span></button>` : ""}
    <div class="bd">
      ${medals.length ? `<div class="medals">${medals.join("")}</div>` : ""}
      ${p.title ? `<p class="ttl">${esc(p.title)}</p>` : ""}
      <p class="au">${esc(p.authors).replace(/Se Young Chun/g, "<b>Se Young Chun</b>")}</p>
      ${p.rest ? `<p class="ve"><span class="tp">${p.type}</span>${esc(p.rest).replace(/(Accepted at )?(NeurIPS|ICML|ICLR|CVPR|ICCV|ECCV|AAAI|MICCAI|WACV|ICRA)\b(?!\s*W)/, "$1<i>$2</i>")}${[...new Set(hot)].map(x => ` <span class="mini hot">${esc(x)}</span>`).join("")}${awards.map(a => ` <span class="mini ${medalAwards.includes(a) ? "award" : "note"}">${esc(a)}</span>`).join("")}</p>` : ""}
      ${(p.also || []).map(a => `<p class="also">${a.raw ? "" : "Also presented at "}${esc(a.venue)}${a.badges.map(([k, b]) => ` <span class="mini ${k}">${esc(b)}</span>`).join("")}</p>`).join("")}
      ${p.links.length ? `<div class="btns">${p.links.map(btn).join("")}</div>` : ""}
    </div>
  </article>`;
}

function parse(md) {
  const out = []; let year = "", type = "";
  md.split("\n").forEach(line => {
    let m;
    if ((m = line.match(/^## (.+)/))) { year = m[1].trim(); return; }
    if ((m = line.match(/^### (.+)/))) { const t = TYPE.find(([, r]) => r.test(m[1].trim())); type = t ? t[0] : m[1].trim(); return; }
    if (!line.startsWith("- ")) return;
    let s = line.slice(2).trim();
    const links = [];
    let thumb = "";
    s = s.replace(/\[\[([^\]]+)\]\(([^)\s]+)\)\]/g, (_, l, u) => {
      const k = l.trim().toLowerCase();
      if (k === "image" || k === "thumbnail" || k === "figure") thumb = u; else links.push([k, u]);
      return ""; });
    const tm = s.match(/[“"](.+?),?[”"]/);
    let authors = s, title = "", rest = "";
    if (tm) { authors = s.slice(0, tm.index).replace(/,\s*$/, ""); title = tm[1].replace(/,$/, ""); rest = s.slice(tm.index + tm[0].length).replace(/^,\s*/, ""); }
    const badges = [];
    rest = rest.replace(/\(([^()]*)\)/g, (all, inner) => {
      const parts = inner.split(/,\s*/);
      if (parts.every(p => HOT.test(p.trim()))) { parts.forEach(p => badges.push(["hot", p.trim()[0].toUpperCase() + p.trim().slice(1)])); return ""; }
      if (parts.some(p => HOT.test(p.trim()))) {
        parts.forEach(p => badges.push([HOT.test(p.trim()) ? "hot" : "award", p.trim().replace(/^oral$/i, "Oral")])); return ""; }
      if (AWARD.test(inner)) { badges.push(["award", inner.trim()]); return ""; }
      return all;
    }).replace(/\s{2,}/g, " ").trim().replace(/,\s*$/, "");
    out.push({ year, type, authors, title, rest, links, badges, thumb, month: monthOf(rest) });
  });
  return out;
}

let PUBS = [], state = { type: "All", rec: false, q: "" };
const yearKey = y => parseInt(y, 10);

function render() {
  const q = state.q.toLowerCase();
  const items = PUBS.filter(p =>
    (state.type === "All" || p.type === state.type) &&
    (!state.rec || p.badges.some(b => b[0] === "hot")) &&
    (!q || (p.title + " " + p.authors + " " + p.rest + " " + (p.also || []).map(a => a.venue).join(" ")).toLowerCase().includes(q)));
  const years = [...new Set(items.map(p => p.year))];
  document.getElementById("years").innerHTML = '<span class="t">Year</span>' + years.map(y => `<a href="#y${y}">${y}</a>`).join("");
  if (!items.length) { document.getElementById("list").innerHTML = '<p class="empty">No publications match these filters.</p>'; return; }
  const order = TYPE.map(t => t[0]);
  document.getElementById("list").innerHTML = years.map(y => {
    // all types are mixed and ordered by month, newest first (ties keep the file order)
    const list = items.filter(p => p.year === y).sort((a, b) => b.month - a.month);
    return `<section class="ygroup" id="y${y}"><h2>${y}<span class="count">${list.length}</span></h2>` + list.map(card).join("") + `</section>`;
  }).join("");
}

function buildTypes() {
  const counts = {}; PUBS.forEach(p => counts[p.type] = (counts[p.type] || 0) + 1);
  const types = ["All", ...TYPE.map(t => t[0]).filter(t => counts[t])];
  const el = document.getElementById("types");
  el.innerHTML = types.map(t => `<button class="chip-btn" data-t="${t}" aria-pressed="${t === state.type}">${t}<span class="c">${t === "All" ? PUBS.length : counts[t]}</span></button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { state.type = b.dataset.t; el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
}

document.getElementById("rec").onclick = e => { state.rec = !state.rec; e.currentTarget.setAttribute("aria-pressed", state.rec); render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); render(); };

// highlight the year currently in view
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll("#years a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-180px 0px -70% 0px" });
const observe = () => document.querySelectorAll(".ygroup").forEach(s => io.observe(s));


// click a figure to see it at full size
const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  const t = e.target.closest(".th"); if (!t) return;
  lb.querySelector("img").src = t.dataset.src; lb.querySelector("img").alt = t.dataset.cap;
  lb.querySelector("p").textContent = t.dataset.cap; lb.showModal();
});
lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".x")) lb.close(); });

fetch("publications.md").then(r => r.text()).then(md => {
  // Types listed here are kept in publications.md but not shown on the page
  const HIDE = ["Domestic", "Patent"];
  PUBS = mergePreprints(mergeWorkshops(parse(md).filter(p => !HIDE.includes(p.type))));
  const conf = PUBS.filter(p => p.type === "Conference" || p.type === "Journal").length;
  document.getElementById("summary").textContent = `${PUBS.length} items since 2004, including ${conf} journal and conference papers.`;
  buildTypes(); render(); observe();
  const _r = render; render = () => { _r(); observe(); };
}).catch(() => { document.getElementById("summary").textContent = "Could not load publications.md."; });
</script>
